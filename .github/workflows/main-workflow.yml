name: CI/CD & Notification

on:
  push:
    branches:
      - develop
      - 'feat/*'
      - 'fix/*'
  pull_request:
    types: [opened, closed, reopened]

jobs:
  # Job 1: Cek Kualitas Kode (Flutter Analyze)
  quality-check:
    name: Quality Check (Analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze

  # Job 2: Notifikasi Telegram
  notify:
    needs: quality-check
    if: always() # Jalankan meskipun quality check gagal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. Notifikasi Update Branch Develop (Reminder Pull)
      - name: Notify Develop Update
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html  # <-- PENTING: Mengaktifkan mode HTML
          message: |
            🚀 <b>UPDATE ALERT: DEVELOP BRANCH</b>
            
            Branch <code>develop</code> baru saja diperbarui oleh <b>${{ github.actor }}</b>.
            
            ⚠️ <b>PERHATIAN REKAN TIM:</b>
            Mohon yang sedang di branch lain segera lakukan sinkronisasi:
            
            <code>git pull origin develop</code>
            
            <i>Agar tidak terjadi konflik kode yang menumpuk!</i>
            
            📝 <b>Commit:</b>
            <pre>${{ github.event.head_commit.message }}</pre>

      # 2. Notifikasi Pull Request Baru
      - name: Notify New PR
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            📝 <b>NEW PULL REQUEST</b>
            
            <b>Judul:</b> ${{ github.event.pull_request.title }}
            <b>Oleh:</b> ${{ github.actor }}
            <b>Ke Branch:</b> <code>${{ github.event.pull_request.base.ref }}</code>
            
            🔍 <a href="${{ github.event.pull_request.html_url }}"><b>KLIK DI SINI UNTUK REVIEW</b></a>

      # 3. Notifikasi PR Merged / Closed
      - name: Notify PR Status
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            ✅ <b>PULL REQUEST SELESAI</b>
            
            <b>Judul:</b> ${{ github.event.pull_request.title }}
            <b>Status:</b> ${{ github.event.pull_request.merged && 'MERGED 🟣' || 'CANCELED/CLOSED 🔴' }}
            <b>Oleh:</b> ${{ github.event.pull_request.user.login }}
            
            🔗 <a href="${{ github.event.pull_request.html_url }}">Lihat Detail PR</a>

      # 4. Notifikasi Jika Flutter Analyze Gagal
      - name: Notify Build Failure
        if: needs.quality-check.result == 'failure'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            ❌ <b>BUILD ERROR / ANALYZE FAILED</b>
            
            Ada kode yang error pada push terbaru oleh <b>${{ github.actor }}</b>.
            
            🚫 <i>Mohon cek log Action di GitHub sebelum merge!</i>
            
            👉 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"><b>LIHAT LOG ERROR</b></a>